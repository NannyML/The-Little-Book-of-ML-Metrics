name: development build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tex compile
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: book
          root_file: main.tex
          latexmk_use_xelatex: true
          extra_fonts: |
            ./fonts
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly > /dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly build" --notes "Latest build of main."
          gh release upload nightly book/main.pdf --clobber
          gh release edit nightly --prerelease --title "Nightly build" --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
